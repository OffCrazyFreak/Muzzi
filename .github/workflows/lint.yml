name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, with the tag in the comment. A tag can be moved;
      # a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to survive the
          # step and end up in .git/config or an artifact.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned so a ruff release cannot turn CI red on its own. The rule set
      # lives in ruff.toml, not here.
      - run: pip install ruff==0.16.2
      - run: ruff check .
