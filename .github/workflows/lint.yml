name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned so a ruff release cannot turn CI red on its own. The rule set
      # lives in ruff.toml, not here.
      - run: pip install ruff==0.16.2
      - run: ruff check .
